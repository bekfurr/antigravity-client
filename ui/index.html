<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity Client</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f1c;
      --surface: #13192b;
      --border: #25304d;
      --text: #eef2ff;
      --muted: #93a3c7;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 30%, #152242 0%, var(--bg) 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: rgba(19, 25, 43, 0.88);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 18px;
      border-radius: 50%;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: var(--accent);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; }
    p { font-size: 0.9rem; color: var(--muted); line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Connecting to Antigravity</h1>
    <p>Loading your Remote Control workspace at antigravity.google.com...</p>
  </div>
</body>
</html>
